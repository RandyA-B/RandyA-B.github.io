<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles/default.css">

</head>
<body>
    <div data-include="components/header.html"></div>
    <main>
        <h1>Survey</h1>
        <p>How was your stay at the Poised Panther?</p>

        <fieldset class="survey-fieldset">
            <form id="survey-form">
                <div>
                    <label for="last-name">Last Name:</label>
                    <input type="text" id="last-name" name="last-name">
                </div>
                <div>
                    <label for="first-name">First Name:</label>
                    <input type="text" id="first-name" name="first-name">
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>
                <div>
                    <label for="rating">Rating:</label>
                    <select name="rating" id="rating">
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Very Poor</option>
                    </select>
                </div>
                <div>
                    <label for="recommendation">Would you say you are more likly to recommend us than not?</label>
                    <div>
                        <input type="radio" id="recommendation" name="recommend" value="yes">
                        <label for="recommendation">Yes</label>
                        <input type="radio" id="recommend-no" name="recommend" value="no">
                        <label for="recommend-no">No</label>
                    </div>
                </div>
                <div>
                    <label>Which season would you say is the best time to spend here?</label>
                    <div>
                        <input type="checkbox" id="season-winter">
                        <label for="season-winter">Winter</label>
                        <input type="checkbox" id="season-spring">
                        <label for="season-spring">Spring</label>
                        <input type="checkbox" id="season-summer">
                        <label for="season-summer">Summer</label>
                        <input type="checkbox" id="season-fall">
                        <label for="season-fall">Fall</label>
                    </div>
                </div>
                <div>
                    <label for="comments">Additional Comments:</label>
                    <textarea id="comments" name="comments"></textarea>
                </div>
                <div>
                    <button type="submit">Submit</button>
                </div>
            </form>
        </fieldset>
    </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/include.min.js"></script>
</body>
</html>

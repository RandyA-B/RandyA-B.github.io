<main>
    <h2>Contact / Submit a Recipe</h2>
    <p>Have a recipe idea or suggestion? Send it to Bob!</p>

    <form id="recipe-form">
        <label for="name">Your Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Your Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="recipe">Recipe Idea:</label><br>
        <textarea id="recipe" name="recipe" rows="5" required></textarea><br><br>

        <button type="submit">Submit</button>
    </form>

    <img src="images/placeholder_contact.jpg" alt="Contact Image" class="rounded shadow" width="300">
</main>

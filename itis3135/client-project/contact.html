<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact – Skinner's Recipes</title>
    <link rel="stylesheet" href="styles/default.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>

<header id="site-header"></header>

<nav id="main-nav"></nav>

<main>
    <h2>Contact / Submit a Recipe</h2>

    <div class="contact-section">
        <p>Have a recipe idea or suggestion? Fill out the form below and send it to Ian!</p>

        <form id="recipe-form">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="recipe">Recipe Idea:</label>
            <textarea id="recipe" name="recipe" rows="6" required></textarea>

            <button type="submit">Submit Recipe</button>
        </form>

        <div id="form-success" style="display:none;">
            <p class="success-message">Thank you! Your recipe idea has been submitted.</p>
        </div>
    </div>
</main>

<footer id="site-footer"></footer>


<script defer src="script.js"></script>
</body>
</html>

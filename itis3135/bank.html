<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randy Brown's Poised Panther | ITIS 3135 | Bank</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles/default.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Datatype:wght@100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Nova+Square&family=Offside&family=Roboto+Slab:wght@100..900&family=Zen+Dots&display=swap" rel="stylesheet">
</head>
<body>
    <div data-include="components/header.html"></div>
    <main>
        <h2>Bank Account Manager</h2>
        <hr>

        <div class="bank-balance-card">
            <div class="bank-balance-label">Current Balance</div>
            <div id="bank-balance">$0</div>
        </div>

        <div class="bank-actions-grid">
            <div class="bank-action-card">
                <h3>Deposit</h3>
                <div class="bank-form">
                    <label for="deposit-amount" class="sr-only">Deposit amount</label>
                    <input type="number" id="deposit-amount" placeholder="Amount" min="0.01" step="0.01">
                    <button id="deposit-btn">Deposit</button>
                </div>
                <p id="deposit-msg" class="bank-msg"></p>
            </div>
            <div class="bank-action-card">
                <h3>Withdraw</h3>
                <div class="bank-form">
                    <label for="withdraw-amount" class="sr-only">Withdrawal amount</label>
                    <input type="number" id="withdraw-amount" placeholder="Amount" min="0.01" step="0.01">
                    <button id="withdraw-btn">Withdraw</button>
                </div>
                <p id="withdraw-msg" class="bank-msg"></p>
            </div>
        </div>

        <div class="bank-summary-grid">
            <div class="bank-summary-card">
                <div class="bank-summary-label">All Deposits</div>
                <div id="deposits-list" class="bank-summary-amounts"></div>
            </div>
            <div class="bank-summary-card">
                <div class="bank-summary-label">All Withdrawals</div>
                <div id="withdrawals-list" class="bank-summary-amounts"></div>
            </div>
        </div>

        <div class="bank-history-card">
            <h3>Transaction History</h3>
            <div id="transaction-log"></div>
        </div>
    </main>

    <div data-include="components/footer.html"></div>
    <script src="scripts/include.min.js"></script>
    <script src="scripts/bank.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randy Brown's Poised Panther | ITIS 3135 | Weather</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles/default.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Datatype:wght@100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Nova+Square&family=Offside&family=Roboto+Slab:wght@100..900&family=Zen+Dots&display=swap" rel="stylesheet">
</head>
<body>
    <div data-include="components/header.html"></div>
    <main>
        <h2>Weather App</h2>
        <hr>
        <p>Select a city below to get live weather conditions.</p>

        <div class="weather-search">
            <label for="city-select" class="sr-only">Select a city</label>
            <select id="city-select">
                <option value="">-- Select a city --</option>
                <option value="new york">New York</option>
                <option value="los angeles">Los Angeles</option>
                <option value="chicago">Chicago</option>
                <option value="paris">Paris</option>
                <option value="tokyo">Tokyo</option>
                <option value="london">London</option>
            </select>
            <button id="get-weather-btn">Get Weather</button>
        </div>

        <div id="weather-display" class="weather-card">
            <div class="weather-card-header">
                <img id="weather-icon" alt="Weather icon">
                <div class="weather-header-text">
                    <div id="location" class="weather-location"></div>
                    <div id="weather-main" class="weather-condition"></div>
                </div>
            </div>
            <div id="main-temperature" class="weather-temp"></div>
            <div class="weather-stats-grid">
                <div class="weather-stat">
                    <div class="stat-label">Feels Like</div>
                    <div id="feels-like" class="stat-value"></div>
                </div>
                <div class="weather-stat">
                    <div class="stat-label">Humidity</div>
                    <div id="humidity" class="stat-value"></div>
                </div>
                <div class="weather-stat">
                    <div class="stat-label">Wind</div>
                    <div id="wind" class="stat-value"></div>
                </div>
                <div class="weather-stat">
                    <div class="stat-label">Wind Gust</div>
                    <div id="wind-gust" class="stat-value"></div>
                </div>
            </div>
        </div>
    </main>

    <div data-include="components/footer.html"></div>
    <script src="scripts/include.min.js"></script>
    <script src="scripts/weather.js"></script>
</body>
</html>
